<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent 后台管理</title>
  <style>
    :root {
      --fg: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
      --card: #ffffff;
      --bg: #f3f4f6;
      --danger: #dc2626;
      --ok: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--fg);
      background: var(--bg);
      line-height: 1.6;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    nav { display: flex; gap: 4px; }
    nav button {
      border: none;
      background: transparent;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 8px;
      color: var(--muted);
    }
    nav button.active { background: #eef2ff; color: var(--accent); font-weight: 600; }
    main { max-width: 960px; margin: 24px auto; padding: 0 20px; }
    section { display: none; }
    section.active { display: block; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 15px; margin: 0 0 12px; }
    button.btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    button.btn:hover { opacity: 0.9; }
    button.btn:disabled { opacity: 0.5; cursor: not-allowed; }
    button.ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    button.danger { color: var(--danger); border-color: #fecaca; background: #fef2f2; }
    input[type="text"], textarea, input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 10px;
    }
    textarea { min-height: 80px; resize: vertical; }
    .muted { color: var(--muted); font-size: 13px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .tag {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #eef2ff;
      color: var(--accent);
      margin: 0 4px 4px 0;
    }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .stat .num { font-size: 26px; font-weight: 700; }
    .stat .label { color: var(--muted); font-size: 13px; }
    .chunk {
      background: #f9fafb;
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      margin-bottom: 8px;
      border-radius: 0 8px 8px 0;
      font-size: 13px;
    }
    .answer-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 12px;
      white-space: pre-wrap;
      font-size: 14px;
    }
    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--danger);
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
    }
    .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <h1>🤖 Agent 后台管理</h1>
    <nav>
      <button data-tab="docs" class="active">知识库</button>
      <button data-tab="run">运行</button>
      <button data-tab="sessions">会话</button>
      <button data-tab="stats">统计</button>
    </nav>
  </header>

  <main>
    <!-- 知识库 -->
    <section id="tab-docs" class="active">
      <div class="card">
        <h2>上传文档</h2>
        <input type="file" id="fileInput" accept=".md,.txt" multiple />
        <div class="hint">选一个或多个 .md / .txt 文件,自动上传并重建索引(替代手动往 rag/docs/ 放文件)</div>
      </div>
      <div class="card">
        <div class="row">
          <h2 style="margin:0">文档列表</h2>
          <button class="ghost" id="rebuildBtn">重建索引</button>
        </div>
        <div id="docList" class="muted">加载中…</div>
      </div>
      <div class="card">
        <h2>试问(测试检索)</h2>
        <input type="text" id="askInput" placeholder="输入问题,验证知识库检索效果…" />
        <button class="btn" id="askBtn">提问</button>
        <div id="askResult"></div>
      </div>
    </section>

    <!-- 运行 -->
    <section id="tab-run">
      <div class="card">
        <h2>运行 agent(带会话记录)</h2>
        <input type="text" id="runInput" placeholder="输入问题,例如:帮我算一下 (48+52)*3" />
        <button class="btn" id="runBtn">运行</button>
        <div id="runResult" class="hint">结果会自动记录到会话历史 + 统计。</div>
      </div>
    </section>

    <!-- 会话 -->
    <section id="tab-sessions">
      <div class="card">
        <h2>会话历史</h2>
        <div id="sessionList" class="muted">加载中…</div>
      </div>
    </section>

    <!-- 统计 -->
    <section id="tab-stats">
      <div class="stat-grid" id="statCards"></div>
      <div class="card" style="margin-top:16px">
        <h2>工具调用排行</h2>
        <div id="toolRank"></div>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    // tab 切换
    document.querySelectorAll("nav button").forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll("nav button").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll("main section").forEach((s) => s.classList.remove("active"));
        btn.classList.add("active");
        $("tab-" + btn.dataset.tab).classList.add("active");
        // 切到会话/统计时刷新
        if (btn.dataset.tab === "sessions") loadSessions();
        if (btn.dataset.tab === "stats") loadStats();
        if (btn.dataset.tab === "docs") loadDocs();
      };
    });

    async function api(method, path, body) {
      const opts = { method };
      if (body !== undefined) {
        opts.headers = { "Content-Type": "application/json" };
        opts.body = JSON.stringify(body);
      }
      const res = await fetch(path, opts);
      return res.json();
    }

    // ---------- 知识库 ----------
    async function loadDocs() {
      const { docs, indexed } = await api("GET", "/api/docs");
      if (!docs || docs.length === 0) {
        $("docList").innerHTML = `暂无文档。索引块数:${indexed}`;
        return;
      }
      $("docList").innerHTML =
        `<div class="hint" style="margin-bottom:8px">共 ${docs.length} 个文档,索引 ${indexed} 块</div>` +
        `<table><tr><th>文件名</th><th>大小</th><th>修改时间</th><th></th></tr>` +
        docs.map((d) =>
          `<tr>
            <td>${d.name}</td>
            <td>${(d.size / 1024).toFixed(1)} KB</td>
            <td class="muted">${new Date(d.mtime).toLocaleString()}</td>
            <td><button class="ghost danger" onclick="delDoc('${d.name}')">删除</button></td>
          </tr>`
        ).join("") + `</table>`;
    }

    window.delDoc = async (name) => {
      if (!confirm(`删除文档 ${name}?`)) return;
      await api("DELETE", "/api/docs?name=" + encodeURIComponent(name));
      loadDocs();
    };

    $("fileInput").onchange = async (e) => {
      const files = [...e.target.files];
      for (const f of files) {
        const content = await f.text();
        const r = await api("POST", "/api/docs", { name: f.name, content });
        if (r.ok) console.log(`已上传 ${f.name},索引 ${r.indexed} 块`);
      }
      e.target.value = "";
      loadDocs();
    };

    $("rebuildBtn").onclick = async () => {
      const r = await api("POST", "/api/rebuild");
      alert(r.ok ? `重建完成:${r.chunks} 块` : `重建失败:${r.error}`);
      loadDocs();
    };

    $("askBtn").onclick = async () => {
      const q = $("askInput").value.trim();
      if (!q) return;
      $("askResult").innerHTML = '<div class="hint">检索中…</div>';
      const r = await api("POST", "/api/ask", { question: q });
      if (r.error) {
        $("askResult").innerHTML = `<div class="error-box">${r.error}</div>`;
        return;
      }
      const chunksHtml = r.chunks.map((c) =>
        `<div class="chunk"><b>${c.source}</b> (相关度 ${c.score.toFixed(3)})<br>${c.text.slice(0, 200)}…</div>`
      ).join("");
      $("askResult").innerHTML =
        `<div class="answer-box" style="margin-bottom:12px">${r.answer}</div>` +
        `<div class="hint">检索到的资料块:</div>${chunksHtml}`;
    };

    // ---------- 运行 ----------
    $("runBtn").onclick = async () => {
      const q = $("runInput").value.trim();
      if (!q) return;
      $("runBtn").disabled = true;
      $("runBtn").innerHTML = '<span class="spinner"></span>运行中…';
      $("runResult").innerHTML = "";
      try {
        const r = await api("POST", "/api/run", { question: q });
        if (r.error) {
          $("runResult").innerHTML = `<div class="error-box">${r.error}</div>`;
        } else {
          const tools = r.toolsCalled.map((t) => `<span class="tag">${t}</span>`).join("") || '<span class="muted">无</span>';
          $("runResult").innerHTML =
            `<div class="answer-box" style="margin-bottom:12px">${r.answer}</div>` +
            `<div class="row">
              <span class="muted">工具:</span>${tools}
              <span class="muted">token:${r.usage?.total_tokens ?? 0}</span>
              <span class="muted">成本:$ ${r.cost.toFixed(6)}</span>
              <span class="muted">耗时:${(r.durationMs / 1000).toFixed(1)}s</span>
            </div>`;
        }
      } catch (e) {
        $("runResult").innerHTML = `<div class="error-box">${e.message}</div>`;
      }
      $("runBtn").disabled = false;
      $("runBtn").textContent = "运行";
    };

    // ---------- 会话 ----------
    async function loadSessions() {
      const { sessions } = await api("GET", "/api/sessions");
      if (!sessions || sessions.length === 0) {
        $("sessionList").innerHTML = '<div class="muted">还没有会话记录。去「运行」跑一次 agent。</div>';
        return;
      }
      $("sessionList").innerHTML = `<table>
        <tr><th>时间</th><th>问题</th><th>回答</th><th>工具</th><th>token</th><th>成本</th><th></th></tr>` +
        sessions.map((s) =>
          `<tr>
            <td class="muted" style="white-space:nowrap">${new Date(s.timestamp).toLocaleString()}</td>
            <td>${s.question}</td>
            <td>${(s.answer || "").slice(0, 60)}${s.error ? '<span class="error-box" style="padding:1px 6px">错误</span>' : ""}</td>
            <td>${s.toolsCalled.join(", ") || "-"}</td>
            <td>${s.usage?.total_tokens ?? 0}</td>
            <td>$ ${s.cost.toFixed(6)}</td>
          </tr>`
        ).join("") + `</table>`;
    }

    // ---------- 统计 ----------
    async function loadStats() {
      const s = await api("GET", "/api/stats");
      $("statCards").innerHTML = `
        <div class="stat"><div class="num">${s.total}</div><div class="label">总运行次数</div></div>
        <div class="stat"><div class="num">${s.totalTokens}</div><div class="label">总 token</div></div>
        <div class="stat"><div class="num">$ ${s.totalCost.toFixed(4)}</div><div class="label">总成本</div></div>
        <div class="stat"><div class="num">${s.errors}</div><div class="label">错误次数</div></div>`;
      $("toolRank").innerHTML = s.topTools.length
        ? `<table><tr><th>工具</th><th>调用次数</th></tr>` +
          s.topTools.map((t) => `<tr><td>${t.name}</td><td>${t.count}</td></tr>`).join("") + `</table>`
        : '<div class="muted">还没有工具调用记录。</div>';
    }

    // 初始加载
    loadDocs();
  </script>
</body>
</html>
