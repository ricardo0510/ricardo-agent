<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG 知识库助手</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #111820;
    --card: #161e29;
    --border: #223043;
    --text: #e6edf3;
    --muted: #8b98a9;
    --accent: #5b8cff;
    --source: #e8a13a;
    --score: #4cc38a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 14px 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header .hint { color: var(--muted); font-size: 13px; }

  main#chat {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .turn { max-width: 760px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .turn.user { align-self: flex-end; }
  .turn.user .bubble {
    background: #1f3a5f;
    border: 1px solid #2b4a75;
    padding: 10px 14px;
    border-radius: 14px 14px 4px 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 检索结果区 */
  .retrieval { display: flex; flex-direction: column; gap: 10px; }
  .retrieval-title {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .chunk-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .chunk-head { display: flex; align-items: center; gap: 8px; }
  .chunk-source {
    font-family: "SF Mono", "Fira Code", Consolas, monospace;
    font-size: 13px;
    color: var(--source);
    font-weight: 600;
  }
  .chunk-score { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .score-bar {
    width: 70px; height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
  }
  .score-bar > span {
    display: block; height: 100%;
    background: var(--score);
    border-radius: 3px;
  }
  .chunk-text {
    font-size: 13.5px;
    color: var(--text);
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 150px;
    overflow-y: auto;
    border-left: 2px solid var(--border);
    padding-left: 10px;
  }

  /* 答案 */
  .answer {
    font-size: 15px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    background: rgba(91, 140, 255, 0.06);
    border: 1px solid rgba(91, 140, 255, 0.2);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .answer::before {
    content: "🤖 回答";
    display: block;
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .loading { color: var(--muted); font-size: 14px; padding: 8px 0; }

  footer {
    padding: 14px 22px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    line-height: 1.5;
    max-height: 160px;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  #send:disabled { opacity: 0.45; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>📚 RAG 知识库助手</h1>
  <span class="hint">检索到的资料块 + 相关度分数,全过程可见</span>
</header>

<main id="chat"></main>

<footer>
  <textarea id="input" rows="1" placeholder="问点什么…如「悉尼租房押金多少」「留学生打工有什么限制」"></textarea>
  <button id="send">发送</button>
</footer>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function addUserBubble(text) {
    const turn = document.createElement("div");
    turn.className = "turn user";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    turn.appendChild(bubble);
    chat.appendChild(turn);
    scrollToBottom();
  }

  // 渲染一次问答:检索块 + 答案
  function renderReply(data) {
    const turn = document.createElement("div");
    turn.className = "turn";

    // 检索结果
    if (data.chunks && data.chunks.length) {
      const box = document.createElement("div");
      box.className = "retrieval";
      const title = document.createElement("div");
      title.className = "retrieval-title";
      title.textContent = `🔍 检索到 ${data.chunks.length} 个资料块`;
      box.appendChild(title);

      for (const c of data.chunks) {
        const card = document.createElement("div");
        card.className = "chunk-card";

        const head = document.createElement("div");
        head.className = "chunk-head";
        const src = document.createElement("span");
        src.className = "chunk-source";
        src.textContent = "📄 " + c.source;
        const score = document.createElement("span");
        score.className = "chunk-score";
        const pct = Math.round(c.score * 100);
        const bar = document.createElement("span");
        bar.className = "score-bar";
        const fill = document.createElement("span");
        fill.style.width = pct + "%";
        bar.appendChild(fill);
        score.append(bar, document.createTextNode(pct + "%"));
        head.append(src, score);

        const text = document.createElement("div");
        text.className = "chunk-text";
        text.textContent = c.text;

        card.append(head, text);
        box.appendChild(card);
      }
      turn.appendChild(box);
    }

    // 答案
    const ans = document.createElement("div");
    ans.className = "answer";
    ans.textContent = data.answer;
    turn.appendChild(ans);

    chat.appendChild(turn);
    scrollToBottom();
  }

  async function send() {
    const q = input.value.trim();
    if (!q || sendBtn.disabled) return;

    addUserBubble(q);
    input.value = "";
    input.style.height = "auto";
    input.disabled = true;
    sendBtn.disabled = true;

    const loading = document.createElement("div");
    loading.className = "loading";
    loading.textContent = "🔍 检索中…";
    chat.appendChild(loading);
    scrollToBottom();

    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q }),
      });
      if (!res.ok) throw new Error("请求失败 " + res.status);
      const data = await res.json();
      loading.remove();
      renderReply(data);
    } catch (e) {
      loading.textContent = "出错了:" + e.message;
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });
  sendBtn.addEventListener("click", send);
</script>
</body>
</html>
